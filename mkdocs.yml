site_name: PS UiPath for Coding Agents Bootcamp
site_url: https://shirley-hastier.github.io/ps-uipath-coding-agents-bootcamp/
site_description: Hands-on bootcamp handbook for building UiPath agents and Maestro orchestrations with coding agents
site_author: Shirley Hastier

theme:
  name: material
  font:
    text: Inter
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

hooks:
  - hooks/split_cols.py

# main.py supplies environment variables (training_url, training_tenant, env_label)
# driven by the BOOTCAMP_ENV env var (staging | prod). See main.py.
plugins:
  - search
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Program Overview: program-overview.md
  - Day 1 — Builder Foundations:
    - Day 1: day-1/index.md
    - 1. UiPath Vision & Why Coding Agents Matter: day-1/1-why-coding-agents-matter.md
    - 2. Environment Setup: day-1/2-environment-setup.md
    - 3. Prompting Coding Agents: day-1/3-prompting-coding-agents.md
    - 4. Hands-On Lab — Build a Low-Code Agent: day-1/4-hands-on-lab-sentiment-agent.md
    - 5. Reflection & Day 2 Preview: day-1/5-reflection-and-day-2-preview.md
  - Day 2 — Enterprise Agent Patterns: day-2/index.md
  - Days 3-10 — Office Hours: days-3-10-office-hours.md
  - Resources: resources.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
