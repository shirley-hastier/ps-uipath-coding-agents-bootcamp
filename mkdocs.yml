site_name: Professional Services UiPath for Coding Agents Builder Bootcamp
site_url: https://shirley-hastier.github.io/ps-uipath-coding-agents-bootcamp/
site_description: Hands-on bootcamp handbook for building UiPath agents and Maestro orchestrations with coding agents
site_author: Shirley Hastier

theme:
  name: material
  logo: assets/images/logo.png
  font:
    text: Inter
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

hooks:
  - hooks/split_cols.py

# main.py supplies environment variables (training_url, training_tenant, env_label)
# driven by the BOOTCAMP_ENV env var (staging | prod). See main.py.
plugins:
  - search
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Program Overview: program-overview.md
  - Day 1 — Builder Foundations:
    - Day 1: day-1/index.md
    - 1. UiPath Vision & Why Coding Agents Matter: day-1/1-why-coding-agents-matter.md
    - 2. Environment Setup: day-1/2-environment-setup.md
    - 3. Prompting Coding Agents: day-1/3-prompting-coding-agents.md
    - 4. Hands-On Lab — Build a Low-Code Agent: day-1/4-hands-on-lab-sentiment-agent.md
    - 5. Reflection & Day 2 Preview: day-1/5-reflection-and-day-2-preview.md
  - Day 2 — Enterprise Agent Patterns:
    - Day 2: day-2/index.md
    - 1. Common Agent Design Patterns: day-2/1-agent-design-patterns.md
    - 2. Enterprise Data & Context Grounding: day-2/2-context-grounding.md
    - 3. Tool-Using Agents & Integrations: day-2/3-tools-and-integrations.md
    - 4. Human-in-the-Loop & Escalation Design: day-2/4-hitl-and-escalation.md
    - 5. Hands-On Lab — Build a Conversational Agent: day-2/5-hands-on-lab-conversational-agent.md
    - 6. Coded Agents & Production Readiness: day-2/6-coded-agents-and-production-readiness.md
    - 7. Reflection & Office Hours Handoff: day-2/7-reflection-and-office-hours-handoff.md
  - Days 3-10 — Office Hours:
    - Overview: days-3-10/index.md
    - Day 3 — Prompting Coding Agents: days-3-10/day-3.md
    - Day 4 — Skills and CLI Hygiene: days-3-10/day-4.md
    - Day 5 — Low-Code Agent Authoring: days-3-10/day-5.md
    - Day 6 — MCP Server Patterns: days-3-10/day-6.md
    - Day 7 — External and Coded Agents: days-3-10/day-7.md
    - Day 8 — Conversational Agents: days-3-10/day-8.md
    - Day 9 — IXP / DU Document Intake: days-3-10/day-9.md
    - Day 10 — Evals, Governance, Deployment: days-3-10/day-10.md
  - Resources: resources.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
